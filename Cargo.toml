[package]
name = "advent-999-search-mcp"
version = "0.2.0"
description = "advent-999-search-mcp MCP: web search + local file search (Everything)"
edition = "2021"

[[bin]]
name = "advent-999-search-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "io-util", "io-std", "sync", "macros", "process"] }
reqwest = { version = "0.12", features = ["json", "socks", "cookies", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.21"
ego-tree = "0.9.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
encoding_rs = "0.8"
async-trait = "0.1"
url = "2"
zhihu_sign = "0.1"
aes = "0.8"
cipher = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
